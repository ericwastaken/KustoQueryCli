services:
  kusto-query-cli:
    image: ${KQC_RUNTIME_IMAGE:-${KQC_IMAGE:-kusto-query-cli:${KUSTO_QUERY_CLI_VERSION}}}
    volumes:
      - type: bind
        source: ./queries
        target: /usr/src/app/queries
      - type: volume
        source: kusto-query-cli-azure-state
        target: /root/.azure
    entrypoint: ["/usr/src/app/entrypoint.sh"]
volumes:
    kusto-query-cli-azure-state:
