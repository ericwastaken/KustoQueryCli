services:
  kusto-query-cli:
    build: .
    image: kusto-query-cli:1.1.0
    volumes:
      - type: bind
        source: ./queries
        target: /usr/src/app/queries
      - type: volume
        source: docker-azure-state
        target: /root/.azure
    entrypoint: ["/usr/src/app/entrypoint.sh"]
volumes:
    docker-azure-state:
