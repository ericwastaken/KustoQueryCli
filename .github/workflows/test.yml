name: Tests

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    matrix:
        runs-on: ubuntu-24.04
        outputs:
            python: ${{ steps.matrix.outputs.python }}
            docker: ${{ steps.matrix.outputs.docker }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - id: matrix
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path
                  config = json.loads(Path('scripts/release-matrix.json').read_text())
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      for name, rows in config.items():
                          print(name + '=' + json.dumps({'include': rows}), file=output)
                  PY

    python:
        needs: matrix
        name: Python ${{ matrix.python }} / ${{ matrix.mcp }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.python) }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: ${{ matrix.python }}
                  cache: pip
            - name: Shared source and compatibility checks
              env:
                  TEST_PYTHON: ${{ matrix.python }}
              run: python scripts/release_checks.py python --python-version "$TEST_PYTHON"
            - name: Show check logs on failure
              if: failure()
              run: find .release/ci-checks -name '*.log' -exec tail -n 80 {} \;

    docker:
        needs: matrix
        name: Docker ${{ matrix.platform }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.docker) }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.12'
                  cache: pip
            - name: Shared image and MCP checks
              env:
                  TEST_PLATFORM: ${{ matrix.platform }}
              run: python scripts/release_checks.py docker --platform "$TEST_PLATFORM"
            - name: Show check logs on failure
              if: failure()
              run: find .release/ci-checks -name '*.log' -exec tail -n 80 {} \;
