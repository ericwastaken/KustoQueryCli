name: Release maintenance

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Approved layout replacement or historical container backfill
                required: true
                type: choice
                options: [v2.0.0, v1.2.1, v1.3.0]

permissions:
    contents: read

concurrency:
    group: release-publication
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ inputs.tag }}
    GH_TOKEN: ${{ github.token }}

jobs:
    matrix:
        runs-on: ubuntu-24.04
        outputs:
            python: ${{ steps.matrix.outputs.python }}
            docker: ${{ steps.matrix.outputs.docker }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - id: matrix
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path
                  config = json.loads(Path('scripts/release-matrix.json').read_text())
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      for name, rows in config.items():
                          print(name + '=' + json.dumps({'include': rows}), file=output)
                  PY


    image:
        needs: matrix
        if: github.ref == 'refs/heads/main'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.docker) }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 35
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  path: tooling
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ inputs.tag == 'v2.0.0' && github.sha || inputs.tag }}
                  path: source
                  fetch-depth: 0
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.12'
            - name: Authenticate to GHCR
              run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            - name: Build original source and validate registry digest
              env:
                  TEST_PLATFORM: ${{ matrix.platform }}
              run: python tooling/scripts/maintain_releases.py image --tag "$RELEASE_TAG" --source source --platform "$TEST_PLATFORM"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: maintenance-image-${{ strategy.job-index }}
                  path: tooling/.release/maintenance/image-report.json
                  if-no-files-found: error
                  include-hidden-files: true
            - name: Show logs on failure
              if: failure()
              run: find tooling/.release/maintenance -name '*.log' -exec tail -n 80 {} \;

    publish:
        needs: image
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  path: tooling
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ inputs.tag == 'v2.0.0' && github.sha || inputs.tag }}
                  path: source
                  fetch-depth: 0
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: maintenance-image-*
                  path: tooling/.release/maintenance
            - name: Authenticate to GHCR
              run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            - name: Publish verified containers and matching release assets
              run: python3 tooling/scripts/maintain_releases.py finish --tag "$RELEASE_TAG" --source source
