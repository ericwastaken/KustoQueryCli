name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish or recover (never moved)
                required: true
                type: string

permissions:
    contents: read

# Serialize all versions so maintenance releases cannot race latest promotion.
concurrency:
    group: release-publication
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    GH_TOKEN: ${{ github.token }}

jobs:
    prepare:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            python: ${{ steps.prepare.outputs.python }}
            docker: ${{ steps.prepare.outputs.docker }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ env.RELEASE_TAG }}
                  fetch-depth: 0
            - id: prepare
              run: python3 scripts/publish_release.py prepare --tag "$RELEASE_TAG"

    python:
        needs: prepare
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.prepare.outputs.python) }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: ${{ matrix.python }}
                  cache: pip
            - name: Shared source and compatibility checks
              env:
                  TEST_PYTHON: ${{ matrix.python }}
              run: python scripts/release_checks.py python --python-version "$TEST_PYTHON"
            - name: Show logs on failure
              if: failure()
              run: find .release/ci-checks -name '*.log' -exec tail -n 80 {} \;

    image:
        needs: [prepare, python]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 35
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.prepare.outputs.docker) }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ env.RELEASE_TAG }}
                  fetch-depth: 0
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.12'
                  cache: pip
            - name: Authenticate to GHCR
              run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            - name: Build candidate and test its registry digest
              env:
                  TEST_PLATFORM: ${{ matrix.platform }}
              run: python scripts/publish_release.py image --tag "$RELEASE_TAG" --platform "$TEST_PLATFORM"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: image-${{ strategy.job-index }}
                  path: .release/publish/image-report.json
                  if-no-files-found: error
                  include-hidden-files: true
            - name: Show logs on failure
              if: failure()
              run: find .release/publish -name '*.log' -exec tail -n 80 {} \;

    publish:
        needs: image
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ env.RELEASE_TAG }}
                  fetch-depth: 0
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: image-*
                  path: .release/publish
            - name: Authenticate to GHCR
              run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            - name: Publish tested multi-platform image and matching GitHub release
              run: python3 scripts/publish_release.py finish --tag "$RELEASE_TAG"
